[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-flux-2"
version = "0.3.0"
description = "RunAPI Flux 2 SDK for text-to-image and remix-image workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "flux-2", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "image-generation", "text-to-image", "image-api", "flux-api"]
dependencies = ["runapi-core>=0.3.1"]

[project.urls]
Homepage = "https://runapi.ai/models/flux-2"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/flux-2-sdk"
Issues = "https://github.com/runapi-ai/flux-2-sdk/issues"
Changelog = "https://github.com/runapi-ai/flux-2-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/flux-2-sdk/releases/tag/python%2Fv0.3.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "flux-2"
